name: cabildo-local-db

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cabildo_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: cabildo_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabildo_dev -d cabildo_dev"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
