packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

overrides:
  '@isaacs/brace-expansion@<=5.0.0': '>=5.0.1'
  # ajv 6.x only goes up to 6.12.6. Do not use `>=6.12.6` here — that range includes ajv 8 and breaks ESLint/@eslint/eslintrc.
  ajv@>=6.0.0 <6.12.6: 6.12.6
  axios@>=1.0.0 <=1.13.4: '>=1.13.5'
  basic-ftp@<5.2.0: '>=5.2.0'
  brace-expansion@<1.1.13: '>=1.1.13'
  brace-expansion@>=2.0.0 <2.0.3: '>=2.0.3'
  d3-color@<3.1.0: '>=3.1.0'
  defu@<=6.1.4: '>=6.1.5'
  diff@>=6.0.0 <8.0.3: '>=8.0.3'
  effect@<3.20.0: '>=3.20.0'
  fast-xml-parser@>=4.0.0-beta.3 <=5.5.6: '>=5.5.7'
  fast-xml-parser@>=5.0.0 <5.3.5: '>=5.3.5'
  fast-xml-parser@>=5.0.0 <5.3.6: '>=5.3.6'
  fast-xml-parser@>=5.0.0 <5.3.8: '>=5.3.8'
  fast-xml-parser@>=5.0.0 <5.5.6: '>=5.5.6'
  fast-xml-parser@>=5.0.9 <=5.3.3: '>=5.3.4'
  flatted@<3.4.0: '>=3.4.0'
  flatted@<=3.4.1: '>=3.4.2'
  kysely@<=0.28.13: '>=0.28.14'
  kysely@>=0.26.0 <=0.28.11: '>=0.28.12'
  lodash@<=4.17.23: '>=4.18.0'
  lodash@>=4.0.0 <=4.17.22: '>=4.17.23'
  lodash@>=4.0.0 <=4.17.23: '>=4.18.0'
  minimatch@<3.1.3: '>=3.1.3'
  minimatch@<3.1.4: '>=3.1.4'
  minimatch@>=10.0.0 <10.2.1: '>=10.2.1'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3'
  minimatch@>=5.0.0 <5.1.7: '>=5.1.7'
  minimatch@>=5.0.0 <5.1.8: '>=5.1.8'
  minimatch@>=9.0.0 <9.0.6: '>=9.0.6'
  minimatch@>=9.0.0 <9.0.7: '>=9.0.7'
  next@>=10.0.0 <15.5.10: '>=15.5.10'
  next@>=10.0.0 <15.5.14: '>=15.5.14'
  next@>=15.5.1-canary.0 <15.5.10: '>=15.5.10'
  next@>=9.5.0 <15.5.13: '>=15.5.13'
  nodemailer@<8.0.4: '>=8.0.4'
  nodemailer@<=8.0.4: '>=8.0.5'
  # Keep 0.1.x: '>=0.1.13' matches path-to-regexp 8.x and breaks Express 4's router.
  path-to-regexp@<0.1.13: '~0.1.12'
  picomatch@<2.3.2: '>=2.3.2'
  qs@>=6.7.0 <=6.14.1: '>=6.14.2'
  rollup@>=4.0.0 <4.59.0: '>=4.59.0'
  systeminformation@<5.30.8: '>=5.30.8'
  systeminformation@<=5.30.7: '>=5.31.0'
  undici@<6.24.0: '>=6.24.0'
  undici@>=6.0.0 <6.24.0: '>=6.24.0'
  undici@>=7.0.0 <7.24.0: '>=7.24.0'
  undici@>=7.17.0 <7.24.0: '>=7.24.0'
  # Stay on Next 15: peers like next-navigation-guard allow >=15.5.13, which otherwise resolves to Next 16.
  next: 15.5.14
