name: cabildo-dev

services:
  web:
    image: ${CONTAINER_REGISTRY:?CONTAINER_REGISTRY is required}/web:dev-latest
    env_file:
      - ${REMOTE_STACK_ROOT:-/opt/cabildo-dev}/env/web.dev.env
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3002:3000"
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  backend:
    image: ${CONTAINER_REGISTRY:?CONTAINER_REGISTRY is required}/backend:dev-latest
    env_file:
      - ${REMOTE_STACK_ROOT:-/opt/cabildo-dev}/env/backend.dev.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      SERVICE_NAME: api-dev
      RUN_CRONS: "false"
    networks:
      - default
      - storage
    command: ["node", "dist/index.js"]
    security_opt:
      - apparmor=cabildo-backend-jq
      - seccomp=${REMOTE_STACK_ROOT:-/opt/cabildo-dev}/infra/security/seccomp-cabildo-jq.json
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped
    cpus: 0.50
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/topics?search="]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

networks:
  storage:
    external: true
    name: cabildo-storage
